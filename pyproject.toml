[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jjal-maker"
version = "0.1.0"
description = "Trim, crop and timestamp video into GIF, WebP, PNG and APNG."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6-Essentials==6.8.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "Pillow==11.3.0", "pyinstaller==6.21.0"]

[project.gui-scripts]
jjal-maker = "jjal_maker.__main__:main"

[tool.setuptools.packages.find]
include = ["jjal_maker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
